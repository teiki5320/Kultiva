name: CI

# Lance flutter analyze + flutter test à chaque push sur main
# et à chaque pull request. Évite de découvrir un build cassé
# seulement au prochain `flutter run` sur le Mac.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos : style (prefer_const_*, doc comments, etc.)
        # --no-fatal-warnings : code mort historique (unused_element/field)
        # Les vraies erreurs Dart (error level) font toujours échouer.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
