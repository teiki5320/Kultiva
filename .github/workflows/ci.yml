name: CI

# Lance flutter analyze + flutter test à chaque push sur main
# et à chaque pull request, puis vérifie que l'app Android se build
# (le manifest, le signing et la fusion de manifests ne sont pas
# couverts par analyze/test). Évite de découvrir un build cassé
# seulement au prochain `flutter run` sur le Mac.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Version de Flutter épinglée, et alignée sur celle installée sur le Mac
# de Jean. Le code ne compile pas sous 3.38 (RadioGroup, activeThumbColor,
# scaleByDouble…), et un `channel: stable` flottant masquait ce problème.
# Dans l'autre sens, une CI restée en arrière ne voit pas ce qui casse en
# local : la 3.47 exige Kotlin ≥ 2.2.20, et le build Android a cassé sans
# que la CI s'en aperçoive. Bump volontaire, les deux ensemble.
env:
  FLUTTER_VERSION: "3.47.3"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos : style (prefer_const_*, doc comments, etc.)
        # Les warnings (code mort, API dépréciées) font maintenant
        # échouer le build pour éviter l'accumulation silencieuse.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: SDK Android 37
        # permission_handler 13 compile contre le SDK 37, que l'image
        # GitHub n'embarque pas forcément. Sans cette étape, le build
        # échoue sur « Failed to find target with hash string android-37 ».
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" > /dev/null

      - name: Install dependencies
        run: flutter pub get

      - name: Build appbundle
        # Sans android/key.properties (secret non commité), le gradle
        # retombe sur la clé debug : le build valide quand même le
        # manifest, la fusion des plugins et le desugaring.
        run: flutter build appbundle --release

      - name: Build APK par ABI (léger, cible Afrique de l'Ouest)
        # Beaucoup d'utilisateurs AO installent par APK direct (hors
        # Play Store) sur des Android d'entrée de gamme : --split-per-abi
        # produit des APK ~2× plus légers que l'APK universel. Valide
        # aussi que le split fonctionne.
        run: flutter build apk --release --split-per-abi
