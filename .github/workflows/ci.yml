name: CI

# Lance flutter analyze + flutter test à chaque push sur main
# et à chaque pull request, puis vérifie que l'app Android se build
# (le manifest, le signing et la fusion de manifests ne sont pas
# couverts par analyze/test). Évite de découvrir un build cassé
# seulement au prochain `flutter run` sur le Mac.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Version de Flutter épinglée : le code ne compile pas sous < 3.38
# (RadioGroup, activeThumbColor, scaleByDouble…). Un `channel: stable`
# flottant masquait ce problème. Bump volontaire quand on teste une
# nouvelle version en local.
env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos : style (prefer_const_*, doc comments, etc.)
        # Les warnings (code mort, API dépréciées) font maintenant
        # échouer le build pour éviter l'accumulation silencieuse.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Le snapshot du catalogue est-il à jour ?
        # kultiva-catalog.json est généré par tool/export_catalog.dart,
        # mais il est commité exprès : docs/kultivaprix-handoff.md en fait
        # le snapshot de secours que Kultivaprix télécharge quand Supabase
        # est indisponible. Il doit donc rester fidèle au catalogue.
        # Il avait dérivé de 4 332 lignes (97 entrées au lieu de 169, tous
        # les image_asset à null) parce qu'il avait été édité à la main.
        # Ce garde-fou rend la dérive impossible : si tu touches au
        # catalogue, régénère-le et commite-le.
        run: |
          dart run tool/export_catalog.dart
          if ! git diff --exit-code --stat kultiva-catalog.json; then
            echo "::error::kultiva-catalog.json a dérivé du catalogue. Lance 'dart run tool/export_catalog.dart' et commite le résultat."
            exit 1
          fi

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build appbundle
        # Sans android/key.properties (secret non commité), le gradle
        # retombe sur la clé debug : le build valide quand même le
        # manifest, la fusion des plugins et le desugaring.
        run: flutter build appbundle --release

      - name: Build APK par ABI (léger, cible Afrique de l'Ouest)
        # Beaucoup d'utilisateurs AO installent par APK direct (hors
        # Play Store) sur des Android d'entrée de gamme : --split-per-abi
        # produit des APK ~2× plus légers que l'APK universel. Valide
        # aussi que le split fonctionne.
        run: flutter build apk --release --split-per-abi
