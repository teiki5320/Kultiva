name: CI

# Lance flutter analyze + flutter test à chaque push sur main
# et à chaque pull request. Évite de découvrir un build cassé
# seulement au prochain `flutter run` sur le Mac.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
