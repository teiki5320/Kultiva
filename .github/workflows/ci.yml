name: CI

# Lance flutter analyze + flutter test à chaque push sur main
# et à chaque pull request, puis vérifie que l'app Android se build
# (le manifest, le signing et la fusion de manifests ne sont pas
# couverts par analyze/test). Évite de découvrir un build cassé
# seulement au prochain `flutter run` sur le Mac.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Version de Flutter épinglée : le code ne compile pas sous < 3.38
# (RadioGroup, activeThumbColor, scaleByDouble…). Un `channel: stable`
# flottant masquait ce problème. Bump volontaire quand on teste une
# nouvelle version en local.
env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos : style (prefer_const_*, doc comments, etc.)
        # Les warnings (code mort, API dépréciées) font maintenant
        # échouer le build pour éviter l'accumulation silencieuse.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build appbundle
        # Sans android/key.properties (secret non commité), le gradle
        # retombe sur la clé debug : le build valide quand même le
        # manifest, la fusion des plugins et le desugaring.
        run: flutter build appbundle --release
