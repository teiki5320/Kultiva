# Publie la page de présentation (dossier landing/) sur GitHub Pages ;
# elle est servie à l'adresse kultiva.toakeur.com.
name: Publier le site
on:
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - uses: actions/deploy-pages@v4
