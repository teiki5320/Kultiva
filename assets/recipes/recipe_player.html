/* ─── Scènes animées (communes aux deux directions) ─────────── */
.scene-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.scene-svg * { transform-box: fill-box; }
.scene-svg text { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.s-oeil { fill: #2A4A3A; transform-origin: center; animation: s-cligne 4.2s infinite; }
.s-joue { fill: #FF8FAB; opacity: .65; }
.s-bouche { fill: none; stroke: #2A4A3A; stroke-width: 3; stroke-linecap: round; }
.s-soupe { fill: var(--leg-clair, #F2B98F); }
.s-leg { fill: var(--leg, #E8A87C); }
@keyframes s-cligne { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.s-brille { fill: #E8B923; transform-origin: center; animation: s-brille 1.6s ease-in-out infinite; }
.s-brille.b { animation-delay: .8s; }
@keyframes s-brille { 0%, 100% { transform: scale(.4) rotate(0); opacity: 0; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }

/* Mijote */
.s-flamme { transform-origin: 50% 100%; animation: s-flamme .5s ease-in-out infinite alternate; }
.s-flamme.b { animation-delay: .15s; } .s-flamme.c { animation-delay: .3s; }
@keyframes s-flamme { from { transform: scaleY(.85) scaleX(1.05); } to { transform: scaleY(1.2) scaleX(.92); } }
.s-flotte { transform-origin: 50% 100%; animation: s-flotte 1.8s ease-in-out infinite; }
@keyframes s-flotte { 0%, 100% { transform: translateY(4px) rotate(-6deg); } 50% { transform: translateY(-6px) rotate(6deg); } }
.s-vapeur { fill: none; stroke: var(--vapeur, #CFE3D8); stroke-width: 7; stroke-linecap: round; animation: s-vapeur 2.4s ease-out infinite; }
.s-vapeur.b { animation-delay: .8s; } .s-vapeur.c { animation-delay: 1.6s; }
@keyframes s-vapeur { 0% { transform: translateY(14px) scale(.7); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateY(-26px) scale(1.1); opacity: 0; } }
.s-bulle { fill: #FFFFFF; opacity: .7; transform-origin: center; animation: s-bulle 1.3s ease-out infinite; }
.s-bulle.b { animation-delay: .45s; } .s-bulle.c { animation-delay: .9s; }
@keyframes s-bulle { 0% { transform: scale(0); opacity: 0; } 50% { opacity: .9; } 100% { transform: scale(1.2) translateY(-6px); opacity: 0; } }
.s-marmite { animation: s-respire 1.4s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes s-respire { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, .98); } }
/* Le minuteur tourne : ça bout plus fort. Il sonne : la marmite saute. */
.en-marche .s-bulle { animation-duration: .6s; }
.en-marche .s-vapeur { animation-duration: 1.2s; }
.en-marche .s-flamme { animation-duration: .25s; }
.en-marche .s-flotte { animation-duration: .9s; }
.fini .s-marmite, .fini .s-casserole, .fini .s-bocal, .fini .s-grelotte { animation: s-sursaut .55s ease-in-out infinite; }
@keyframes s-sursaut { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-10px) rotate(-4deg); } 60% { transform: translateY(-4px) rotate(4deg); } }

/* Coupe */
.s-couteau { transform-origin: 85% 30%; animation: s-coupe .8s ease-in-out infinite; }
@keyframes s-coupe { 0%, 100% { transform: translateY(-14px) rotate(-6deg); } 45%, 55% { transform: translateY(16px) rotate(2deg); } }
.s-morceau { transform-origin: center; animation: s-saute .8s ease-out infinite; }
.s-morceau.b { animation-delay: .1s; } .s-morceau.c { animation-delay: .2s; }
@keyframes s-saute { 0%, 40% { transform: translate(0, 0) rotate(0); } 60% { transform: translate(6px, -14px) rotate(25deg); } 80%, 100% { transform: translate(10px, 0) rotate(40deg); } }
.s-tressaille { transform-origin: 50% 100%; animation: s-tressaille .8s ease-in-out infinite; }
@keyframes s-tressaille { 0%, 40%, 100% { transform: scale(1); } 50% { transform: scale(1.06, .92); } 60% { transform: scale(.97, 1.04); } }

/* Remue */
.s-cuillere { animation: s-tourne 1.6s linear infinite; }
.s-manege { animation: s-tourne 1.6s linear infinite reverse; }
@keyframes s-tourne {
  0% { transform: translate(-26px, 2px) rotate(-14deg); } 25% { transform: translate(0, 7px) rotate(0); }
  50% { transform: translate(26px, 2px) rotate(14deg); } 75% { transform: translate(0, -4px) rotate(0); }
  100% { transform: translate(-26px, 2px) rotate(-14deg); } }
.s-tourbillon { fill: none; stroke: #FFFFFF; opacity: .7; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 18 14; animation: s-tourbillon 1.6s linear infinite; }
@keyframes s-tourbillon { to { stroke-dashoffset: -64; } }

/* Lave */
.s-goutte { fill: #8EC9E8; animation: s-goutte 1.1s ease-in infinite; }
.s-goutte.b { animation-delay: .27s; } .s-goutte.c { animation-delay: .55s; } .s-goutte.d { animation-delay: .82s; }
@keyframes s-goutte { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; } 85% { transform: translateY(54px) scale(1); opacity: 1; } 100% { transform: translateY(60px) scale(1.3, .4); opacity: 0; } }
.s-lave { transform-origin: 50% 100%; animation: s-frotte 1.1s ease-in-out infinite; }
@keyframes s-frotte { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

/* Verse */
.s-bouteille { transform-origin: 50% 0%; animation: s-penche 3s ease-in-out infinite; }
@keyframes s-penche { 0%, 100% { transform: rotate(118deg); } 50% { transform: rotate(128deg); } }
.s-filet { fill: none; stroke: #F2C46D; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 10 8; animation: s-coule .5s linear infinite; }
@keyframes s-coule { to { stroke-dashoffset: -18; } }
.s-gresille { transform-origin: 50% 100%; animation: s-gresille .35s ease-in-out infinite alternate; }
@keyframes s-gresille { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-4px) rotate(2deg); } }
.s-etincelle { fill: #F2C46D; transform-origin: center; animation: s-etincelle .9s ease-out infinite; }
.s-etincelle.b { animation-delay: .3s; } .s-etincelle.c { animation-delay: .6s; }
@keyframes s-etincelle { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(var(--dx), -22px) scale(1); opacity: 0; } }

/* Sale */
.s-saliere { transform-origin: 50% 30%; animation: s-secoue .45s ease-in-out infinite alternate; }
@keyframes s-secoue { from { transform: rotate(-10deg) translateY(-3px); } to { transform: rotate(10deg) translateY(3px); } }
.s-grain { fill: #FFFFFF; stroke: #C9D8D0; stroke-width: 1; animation: s-grain 1s linear infinite; }
.s-grain.b { animation-delay: .2s; } .s-grain.c { animation-delay: .4s; } .s-grain.d { animation-delay: .6s; } .s-grain.e { animation-delay: .8s; }
@keyframes s-grain { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(46px); opacity: 0; } }
.s-chatouille { transform-origin: 50% 100%; animation: s-chatouille 1s ease-in-out infinite; }
@keyframes s-chatouille { 0%, 100% { transform: scale(1) rotate(0); } 30% { transform: scale(1.05, .95) rotate(-3deg); } 60% { transform: scale(.97, 1.03) rotate(3deg); } }

/* Froid */
.s-grelotte { animation: s-grelotte .18s linear infinite alternate; }
@keyframes s-grelotte { from { transform: translateX(-2px); } to { transform: translateX(2px); } }
.s-flocon { fill: none; stroke: #8EC9E8; stroke-width: 2.5; stroke-linecap: round; animation: s-flocon 3s linear infinite; transform-origin: center; }
.s-flocon.b { animation-delay: -1s; } .s-flocon.c { animation-delay: -2s; } .s-flocon.d { animation-delay: -.5s; }
@keyframes s-flocon { from { transform: translateY(-30px) rotate(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(150px) rotate(180deg); opacity: 0; } }

/* Bocal */
.s-entre { transform-origin: center; animation: s-entre 4s ease-in-out infinite; }
@keyframes s-entre { 0% { transform: translateY(-70px) scale(.9); opacity: 0; } 12% { opacity: 1; } 30%, 100% { transform: translateY(0) scale(1); opacity: 1; } }
.s-remplit { animation: s-remplit 4s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes s-remplit { 0%, 30% { transform: scaleY(.05); } 55%, 100% { transform: scaleY(1); } }
.s-couvre { animation: s-couvre 4s ease-in-out infinite; transform-origin: center; }
@keyframes s-couvre { 0%, 55% { transform: translateY(-46px) rotate(0); opacity: 0; } 60% { opacity: 1; } 68% { transform: translateY(0) rotate(0); } 80%, 100% { transform: translateY(0) rotate(360deg); opacity: 1; } }
.s-coeur { fill: #FF8FAB; transform-origin: center; animation: s-coeur 4s ease-out infinite; }
@keyframes s-coeur { 0%, 80% { transform: translateY(0) scale(0); opacity: 0; } 86% { transform: translateY(-6px) scale(1.15); opacity: 1; } 100% { transform: translateY(-30px) scale(.9); opacity: 0; } }
.s-bocal { transform-origin: 50% 100%; animation: s-content 4s ease-in-out infinite; }
@keyframes s-content { 0%, 80%, 100% { transform: rotate(0); } 86% { transform: rotate(-5deg); } 93% { transform: rotate(5deg); } }

/* On ajoute */
.s-plouf { animation: s-plouf 2.4s cubic-bezier(.5, 0, .7, 1) infinite; transform-origin: center; }
@keyframes s-plouf { 0% { transform: translateY(-110px) rotate(-30deg); opacity: 0; } 10% { opacity: 1; } 45% { transform: translateY(0) rotate(20deg); opacity: 1; } 55%, 100% { transform: translateY(26px) rotate(20deg); opacity: 0; } }
.s-eclabousse { opacity: 0; transform-origin: center; animation: s-eclabousse 2.4s ease-out infinite; }
@keyframes s-eclabousse { 0%, 44% { opacity: 0; transform: translate(0, 0) scale(.5); } 50% { opacity: 1; } 75%, 100% { opacity: 0; transform: translate(var(--dx), -34px) scale(1); } }
.s-casserole { transform-origin: 50% 100%; animation: s-content2 2.4s ease-in-out infinite; }
@keyframes s-content2 { 0%, 44%, 100% { transform: scale(1); } 52% { transform: scale(1.06, .94); } 62% { transform: scale(.98, 1.03); } }

/* Entrée d'une page : la scène arrive en rebondissant */
.entre-d .scene-svg, .entre-g .scene-svg { animation: s-arrive .6s cubic-bezier(.34, 1.56, .64, 1) both; }
@keyframes s-arrive { from { transform: scale(.6) translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Confettis de fin */
.confettis { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
.confettis i { position: absolute; top: -20px; width: 9px; height: 13px; border-radius: 3px; opacity: 0; }
.fin.active .confettis i { animation: s-confetti 2.6s cubic-bezier(.3, .6, .5, 1) both; }
@keyframes s-confetti { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(24px, 105vh) rotate(var(--tourne)); opacity: 0; } }

/* Le point de l'étape qui vient de finir fait un petit saut */
#points i.on { animation: s-hop .45s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes s-hop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  .scene-svg *, .confettis { animation: none !important; }
  .confettis { display: none; }
}

:root {
  --fond: #F5FAF8; --carte: #FFFFFF; --texte: #2A4A3A; --doux: #4E6E5C;
  --vert: #4A9B5A; --vert-fonce: #2F6B3C; --vert-clair: #A8D5A2;
  --terre: #E8A87C; --terre-fonce: #8A4A22; --terre-fond: #FBE6D6;
  --point: #D3E6DA; --trait: #E4F0EA; --puce: rgba(74, 155, 90, .12);
  --ombre: 0 2px 8px rgba(42, 74, 58, .06); --ombre-btn: 0 2px 8px rgba(42, 74, 58, .12);
  --ombre-haute: 0 12px 30px rgba(42, 74, 58, .14);
  --p1: #E3F2E1; --p2: #FBE6D6; --p3: #DFEEF5; --p4: #EEF5DC; --p5: #FFE4EC; --p6: #FBF0CF;
  --piste: #E4F0EA; --btn-texte: #FFFFFF; --vapeur: #CFE3D8;
  --gras: #E3F2E1; --gras-texte: #2F6B3C; --sur-etiquette: #7A5A12;
}
[data-theme="dark"] {
  --fond: #0F1F18; --carte: #1A2E22; --texte: #FFFFFF; --doux: #A9C4B3;
  --vert: #5ABD6A; --vert-fonce: #A8D5A2; --vert-clair: #3E7A4C;
  --terre-fonce: #F2C3A1; --terre-fond: #33281F;
  --point: #1F3528; --trait: #1F3528; --puce: rgba(90, 189, 106, .16);
  --ombre: none; --ombre-btn: none; --ombre-haute: 0 12px 30px rgba(0, 0, 0, .35);
  --p1: #1F3528; --p2: #33281F; --p3: #1E2C33; --p4: #26301E; --p5: #33222A; --p6: #33301E;
  --piste: #1F3528; --btn-texte: #000000; --vapeur: #4E6E5C;
  --gras: rgba(255, 255, 255, .10); --gras-texte: #F2C3A1; --sur-etiquette: #F2D27A;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--fond); color: var(--texte);
  font-family: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
h1, h2, p, ul { margin: 0; padding: 0; }
button { font: inherit; cursor: pointer; }

#app { position: relative; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); background: var(--fond); }
#haut { position: relative; z-index: 4; flex: none; padding: 14px 18px 2px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#points { display: flex; gap: 6px; height: 9px; align-items: center; }
#points i { width: 9px; height: 9px; border-radius: 5px; background: var(--point); transition: width .25s, background .25s; }
#points i.fait { background: var(--vert-clair); }
#points i.on { width: 24px; background: var(--vert); }
[data-page="intro"] #points { visibility: hidden; }
#mini { border: 2px solid var(--terre); background: var(--terre-fond); color: var(--terre-fonce); border-radius: 16px; padding: 5px 14px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
#mini.fini { background: var(--terre); color: #2A1608; animation: battement 1s ease-in-out infinite; }
#mini[hidden] { display: none; }
@keyframes battement { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

#pages { flex: 1 1 auto; min-height: 0; position: relative; }
.page { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
.page.active { display: flex; }

.p1 { background: var(--p1); } .p2 { background: var(--p2); } .p3 { background: var(--p3); }
.p4 { background: var(--p4); } .p5 { background: var(--p5); } .p6 { background: var(--p6); }

.num { flex: none; font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
.texte { flex: none; font-size: 30px; line-height: 1.24; font-weight: 800; letter-spacing: -.01em; overflow-wrap: break-word; }
.texte strong { font-weight: 800; color: var(--gras-texte); background: var(--gras); border-radius: 8px; padding: 0 .18em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

.minuteur { flex: none; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; justify-content: center; }
.t-temps { font-size: 44px; line-height: 1; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.t-temps.long { font-size: 34px; }
.t-etat { font-size: 15px; font-weight: 700; color: var(--doux); }
.fini .t-etat { color: var(--terre-fonce); font-weight: 800; }
.t-btns { display: flex; gap: 10px; }
.t-btns button { height: 48px; padding: 0 16px; border: 0; border-radius: 20px; font-size: 17px; font-weight: 800; background: var(--p1); color: var(--vert-fonce); }
.t-btns [data-t="bascule"] { background: var(--terre); color: #2A1608; }
.t-jauge { flex: none; width: 100%; height: 12px; border-radius: 6px; background: var(--piste); overflow: hidden; }
.t-jauge i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--terre); border-radius: 6px; transition: width .6s ease; }

.puces { flex: none; display: flex; flex-wrap: wrap; gap: 8px; }
.puce { background: var(--carte); border: 2px solid var(--vert); border-radius: 16px; padding: 5px 12px; font-size: 16px; font-weight: 800; color: var(--vert-fonce); }
.puce.garde { background: var(--terre-fond); border-color: var(--terre); color: var(--terre-fonce); }
.sec { flex: none; font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
.ingr { flex: none; width: 100%; list-style: none; text-align: left; }
.ingr li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--trait); }
.ingr li:last-child { border-bottom: 0; }
.qte { flex: none; min-width: 64px; text-align: center; background: var(--p1); color: var(--vert-fonce); border-radius: 10px; padding: 4px 8px; font-size: 17px; font-weight: 800; white-space: nowrap; }
.qte.vide { background: none; display: flex; justify-content: center; }
.qte.vide::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--vert-clair); }
.ingr span { font-size: 18px; font-weight: 700; line-height: 1.3; }
.rien { font-size: 18px; font-weight: 700; color: var(--doux); }

.zone-scene { position: relative; flex: 1 1 0; min-height: 120px; width: 100%; overflow: hidden; }
.zone-scene > .scene-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.zone-scene > .vedette { position: absolute; inset: 6%; }
.zone-scene > .vedette img, .zone-scene > .vedette span { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: grid; place-items: center; }
.vedette { display: grid; place-items: center; animation: v-sautille 2.4s ease-in-out infinite; }
.vedette img { width: 100%; height: 100%; object-fit: contain; }
.vedette span { font-size: 96px; line-height: 1; }
@keyframes v-sautille { 0%, 100% { transform: translateY(4px) rotate(-4deg); } 50% { transform: translateY(-10px) rotate(4deg); } }

.etiquette { flex: none; display: flex; flex-direction: column; gap: 5px; }
.etiquette .sur { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--sur-etiquette); }
.etiquette strong { font-size: 22px; font-weight: 800; }
.etiquette .quand { font-size: 17px; font-weight: 700; }
.etiquette .garde { align-self: flex-start; margin-top: 2px; padding: 5px 11px; border-radius: 9px; background: var(--puce); color: var(--vert-fonce); font-size: 16px; font-weight: 800; }

#bas { position: relative; z-index: 4; flex: none; display: flex; gap: 12px; padding: 10px 18px calc(16px + env(safe-area-inset-bottom)); }
#prec { width: 64px; height: 64px; flex: none; border: 0; border-radius: 20px; background: var(--carte); box-shadow: var(--ombre-btn); display: grid; place-items: center; color: var(--vert); }
#suiv { flex: 1; height: 64px; border: 0; border-radius: 20px; background: var(--vert); color: var(--btn-texte); font-size: 21px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
#suiv.sans-fleche svg { display: none; }
button:focus-visible { outline: 3px solid var(--vert); outline-offset: 2px; }

/* Le texte arrive mot par mot (moins d'une demi-seconde), puis ne bouge plus. */
.mot { display: inline-block; }
.entre-d .mot, .entre-g .mot { animation: mot-monte .42s cubic-bezier(.2, .8, .3, 1) both; animation-delay: calc(var(--i, 0) * 26ms); }
@keyframes mot-monte { from { opacity: 0; transform: translateY(.45em) scale(.96); } to { opacity: 1; transform: none; } }
#suiv, #prec { transition: transform .12s ease; }
#suiv:active, #prec:active { transform: scale(.95); }

/* ─── 13 · Le carrousel kawaii ───
   Trois cartes identiques (même carré arrondi, même cadre, même pastille),
   seules la place et l'échelle changent. Tout est calculé depuis --s, la
   taille de la carte du centre, en unités de conteneur. */
#app, #bas { background: var(--carte); }

/* Points de progression : de petites cartes, comme le carrousel */
#points { gap: 5px; height: 12px; }
#points i { width: 10px; height: 10px; border-radius: 3px; background: var(--trait); }
#points i.fait { background: var(--vert-clair); }
#points i.on { width: 12px; height: 12px; border-radius: 4px; background: var(--vert); transform: rotate(-8deg); }

.v13 { align-items: center; text-align: center; gap: 12px; padding: 4px 0 6px; }
.v13 > :not(.zone-scene):not(.confettis) { margin-left: 22px; margin-right: 22px; }
.v13 > .minuteur, .v13 > .ingr, .v13 > .etiquette { width: calc(100% - 44px); }
.v13 .zone-scene { min-height: 190px; container-type: size; overflow: hidden; }
.v13-piste { position: absolute; inset: 0; --s: min(84cqh, 60cqw); --ecart: calc(var(--s) * .82 + 12px); }

.c13 {
  position: absolute; left: 50%; top: 50%; width: var(--s); height: var(--s);
  transform: translate(-50%, -50%) translateX(var(--dx, 0px)) scale(var(--k, 1));
}
.c13.gauche { --dx: calc(var(--ecart) * -1); --k: .6; }
.c13.droite { --dx: var(--ecart); --k: .6; }
.c13.cote { opacity: .7; }
.c13.cote .scene-svg *, .c13.cote .vedette { animation-play-state: paused !important; }

.c13-anneau { position: absolute; inset: 0; border-radius: 36px; padding: 6px; background: var(--vert-clair); }
.a-minuteur .c13.centre .c13-anneau { background: conic-gradient(var(--terre) calc(var(--p, 0) * 360deg), var(--vert-clair) 0); }
.c13-cadre { position: relative; width: 100%; height: 100%; border-radius: 30px; background: var(--p1); overflow: hidden; }
.c13-cadre::before { content: ""; position: absolute; right: -18%; top: -18%; width: 60%; height: 60%; border-radius: 50%; background: rgba(255, 255, 255, .45); }
[data-theme="dark"] .c13-cadre::before { background: rgba(255, 255, 255, .04); }
.c13-cadre > .scene-svg { position: absolute; left: 6%; top: 10%; width: 88%; height: 84%; }
.c13-cadre > .vedette { position: absolute; inset: 12%; }
.c13-cadre > .vedette img, .c13-cadre > .vedette span { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: grid; place-items: center; }
.c13.centre .c13-anneau { box-shadow: 0 14px 30px rgba(74, 155, 90, .20); animation: c13-flotte 3.2s ease-in-out infinite; }
@keyframes c13-flotte { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-6px) rotate(1deg); } }

/* La pastille autocollant, la même sur les trois cartes */
.c13-badge {
  position: absolute; left: -6px; top: -6px; z-index: 3; width: calc(var(--s) * .2); height: calc(var(--s) * .2); min-width: 38px; min-height: 38px;
  border-radius: 50%; background: var(--terre); color: #2A1608; display: grid; place-items: center;
  font-size: calc(var(--s) * .09); font-weight: 800; transform: rotate(-10deg); box-shadow: 0 4px 10px rgba(232, 168, 124, .45);
}
.c13-badge::after { content: ""; position: absolute; left: 22%; top: 18%; width: 22%; height: 14%; border-radius: 50%; background: rgba(255, 255, 255, .55); transform: rotate(-30deg); }

/* Les cœurs qui s'envolent de la carte du centre */
.c13-coeur { position: absolute; z-index: 4; top: 4%; color: #FF8FAB; font-size: 18px; opacity: 0; pointer-events: none; animation: c13-coeur 4.2s ease-out infinite; }
.c13-coeur.b { left: 76%; animation-delay: 2.1s; font-size: 14px; color: var(--terre); }
.c13-coeur.a { left: 18%; }
@keyframes c13-coeur { 0%, 60% { transform: translateY(0) scale(.4); opacity: 0; } 70% { opacity: 1; } 100% { transform: translateY(-40px) scale(1); opacity: 0; } }

/* L'éclat d'étoiles quand la carte arrive au centre */
.c13-eclats { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 5; pointer-events: none; }
.c13-eclats i { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; opacity: 0; font-style: normal; font-size: 14px; line-height: 12px; text-align: center; }
.entre-d .c13-eclats i, .entre-g .c13-eclats i { animation: c13-eclat .75s cubic-bezier(.2, .8, .3, 1) .38s both; }
@keyframes c13-eclat {
  0% { transform: rotate(var(--a)) translateY(0) scale(.3); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: rotate(var(--a)) translateY(calc(var(--s) * -.68)) scale(1.1); opacity: 0; }
}

/* Le manège : chaque carte part de la place qu'elle occupait */
.entre-d .c13 { animation: .62s cubic-bezier(.3, 1.35, .5, 1) both; }
.entre-g .c13 { animation: .62s cubic-bezier(.3, 1.35, .5, 1) both; }
.entre-d .c13.centre { animation-name: c13-centre-d; }
.entre-d .c13.gauche { animation-name: c13-gauche-d; }
.entre-d .c13.droite { animation-name: c13-droite-d; }
.entre-g .c13.centre { animation-name: c13-centre-g; }
.entre-g .c13.droite { animation-name: c13-droite-g; }
.entre-g .c13.gauche { animation-name: c13-gauche-g; }
@keyframes c13-centre-d { from { transform: translate(-50%, -50%) translateX(var(--ecart)) scale(.6) rotate(8deg); } to { transform: translate(-50%, -50%) translateX(0) scale(1); } }
@keyframes c13-gauche-d { from { transform: translate(-50%, -50%) translateX(0) scale(1); opacity: 1; } to { transform: translate(-50%, -50%) translateX(calc(var(--ecart) * -1)) scale(.6); opacity: .7; } }
@keyframes c13-droite-d { from { transform: translate(-50%, -50%) translateX(calc(var(--ecart) * 2)) scale(.4); opacity: 0; } to { transform: translate(-50%, -50%) translateX(var(--ecart)) scale(.6); opacity: .7; } }
@keyframes c13-centre-g { from { transform: translate(-50%, -50%) translateX(calc(var(--ecart) * -1)) scale(.6) rotate(-8deg); } to { transform: translate(-50%, -50%) translateX(0) scale(1); } }
@keyframes c13-droite-g { from { transform: translate(-50%, -50%) translateX(0) scale(1); opacity: 1; } to { transform: translate(-50%, -50%) translateX(var(--ecart)) scale(.6); opacity: .7; } }
@keyframes c13-gauche-g { from { transform: translate(-50%, -50%) translateX(calc(var(--ecart) * -2)) scale(.4); opacity: 0; } to { transform: translate(-50%, -50%) translateX(calc(var(--ecart) * -1)) scale(.6); opacity: .7; } }

/* Un petit coup de gelée quand on touche la carte */
.c13.centre:active .c13-anneau { animation: c13-gelee .5s ease; }
@keyframes c13-gelee { 0% { transform: scale(1); } 30% { transform: scale(1.06, .94); } 60% { transform: scale(.97, 1.03); } 100% { transform: scale(1); } }

/* La flèche du bouton fait signe d'avancer */
#suiv svg { animation: c13-signe 1.8s ease-in-out infinite; }
@keyframes c13-signe { 0%, 70%, 100% { transform: translateX(0); } 80% { transform: translateX(5px); } 90% { transform: translateX(0); } }

.v13 .num { background: rgba(74, 155, 90, .12); color: var(--vert-fonce); border-radius: 20px; padding: 5px 14px; }
.v13 .texte { max-width: 30ch; }
.v13-intro { overflow-y: auto; }
.v13-intro .zone-scene { flex: none; height: min(62vw, 30vh); }
.v13-intro h1 { font-size: 30px; line-height: 1.06; font-weight: 800; letter-spacing: -.02em; }
.v13-intro .puces { justify-content: center; }
.v13-intro .ingr { background: var(--fond); border-radius: 18px; padding: 2px 16px; }
.v13-fin h1 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
.v13-fin .etiquette { align-items: center; background: var(--fond); border-radius: 18px; padding: 14px 16px; border: 2px solid var(--vert-clair); }
.v13-fin .etiquette .sur { color: var(--vert); }
.v13-fin .etiquette .garde { align-self: center; }

/* ─── 14 · Carrousel « Polaroïd » : photos à bord blanc, légende, ruban de scotch vert ─── */
.v14 .c13-anneau {
  border-radius: 10px; padding: 7% 7% 22% 7%; background: #FFFFFF;
  box-shadow: 0 10px 24px rgba(42, 74, 58, .16);
}
[data-theme="dark"] .v14 .c13-anneau { background: #243B2D; }
.v14.a-minuteur .c13.centre .c13-anneau { background: #FFFFFF; box-shadow: 0 0 0 6px var(--vert-clair), 0 10px 24px rgba(42, 74, 58, .16); }
.v14.a-minuteur .c13.centre .c13-anneau::before { content: ""; position: absolute; left: 7%; right: 7%; bottom: 17%; height: 4%; border-radius: 4px; background: linear-gradient(90deg, var(--terre) calc(var(--p, 0) * 100%), var(--trait) 0); }
.v14 .c13-cadre { border-radius: 4px; background: var(--p1); }
.v14 .c13-cadre::before { display: none; }
.v14 .c13-anneau::after {
  content: attr(data-legende); position: absolute; left: 0; right: 0; bottom: 5.5%;
  font-size: calc(var(--s) * .072); font-weight: 800; color: var(--doux); letter-spacing: .02em;
}
.v14 .c13.gauche .c13-anneau { transform: rotate(-7deg); }
.v14 .c13.droite .c13-anneau { transform: rotate(6deg); }
@keyframes c13-flotte { 0%, 100% { transform: translateY(0) rotate(-2.5deg); } 50% { transform: translateY(-6px) rotate(1.5deg); } }
.v14 .c13-badge {
  left: 50%; top: -5%; width: 42%; height: auto; min-height: 0; padding: 3% 0; border-radius: 3px;
  transform: translateX(-50%) rotate(-4deg); background: rgba(168, 213, 162, .9); color: #2F6B3C;
  font-size: calc(var(--s) * .07); box-shadow: none;
}
.v14 .c13-badge::after { display: none; }
#points i { border-radius: 2px; }
#points i.on { border-radius: 2px; transform: rotate(-8deg); }


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

    var html = '<div class="confettis" aria-hidden="true">';
    for (var i = 0; i < n; i++) {
      html += '<i style="left:' + ((i * 37 + 5) % 96) + '%;background:' + couleurs[i % couleurs.length] +
        ';animation-delay:' + ((i * 0.11) % 1.4).toFixed(2) + 's;animation-duration:' + (2.2 + (i * 0.17) % 1.2).toFixed(2) +
        's;--tourne:' + (i % 2 ? 540 : -540) + 'deg' + (i % 3 === 0 ? ';border-radius:0 100% 0 100%;width:14px;height:14px' : '') + '"></i>';
    }
    return html + '</div>';
  }


  // ─── Morceaux communs aux mises en page ──────────────────────
  var TOUR = [1, 3, 4, 5, 6];
  function couleurEtape(s, i) { return +s.minutes > 0 ? 2 : TOUR[i % TOUR.length]; }

  function pucesHtml() {
    var p = [];
    if (INFOS.temps) p.push('<span class="puce">⏱ ' + echappe(INFOS.temps) + '</span>');
    if (INFOS.parts) p.push('<span class="puce">👥 ' + echappe(INFOS.parts) + '</span>');
    INFOS.autres.forEach(function (a) { p.push('<span class="puce">' + echappe(a) + '</span>'); });
    if (INFOS.garde) p.push('<span class="puce garde">' + echappe(R.emoji || '🫙') + ' ' + echappe(INFOS.garde) + '</span>');
    return p.length ? '<div class="puces">' + p.join('') + '</div>' : '';
  }
  function ingredientsHtml() {
    var li = (R.ingredients || []).map(function (l) {
      var q = ingredientDe(l);
      return '<li><b class="qte' + (q.qte ? '' : ' vide') + '">' + (q.qte ? echappe(q.qte) : '') +
        '</b><span>' + echappe(q.reste) + '</span></li>';
    }).join('');
    return li ? '<h2 class="sec">Ce qu’il te faut</h2><ul class="ingr">' + li + '</ul>'
      : '<p class="rien">Tout se passe dans les étapes 🌱</p>';
  }
  function vedetteHtml() {
    return '<div class="vedette" aria-hidden="true">' +
      (VEG.image ? '<img src="' + echappe(VEG.image) + '" alt="">' : '<span>' + echappe(VEG_EMOJI || R.emoji || '🍽') + '</span>') + '</div>';
  }
  function texteHtml(s, grand) {
    return '<p class="texte" data-fit data-max="' + tailleTexte(s.text, grand) + '" data-min="19">' + enrichi(s.text) + '</p>';
  }
  function numHtml(s, i) {
    return '<span class="num">' + echappe(s.emoji || '') + ' Étape ' + (i + 1) + ' sur ' + N + '</span>';
  }
  function minuteurHtml(jauge) {
    return '<div class="minuteur"><div class="t-bloc"><div class="t-temps" role="timer"></div><div class="t-etat"></div></div>' +
      '<div class="t-btns"><button data-t="bascule"></button><button data-t="plus">+ 5 min</button></div>' +
      (jauge ? '<div class="t-jauge" aria-hidden="true"><i></i></div>' : '') + '</div>';
  }
  function sceneEtape(s) {
    return scene(gesteDe(s.emoji, s.text), s.emoji, 'Illustration animée de l’étape');
  }
  function etiquetteHtml(classe) {
    var avant = consommerAvant(INFOS.garde);
    return '<div class="etiquette ' + (classe || '') + '"><span class="sur">À écrire sur l’étiquette</span>' +
      '<strong>' + echappe(R.name) + '</strong>' +
      '<span class="quand">Préparé le ' + dateLongue(AUJOURDHUI) + '</span>' +
      (avant ? '<span class="garde">' + echappe(R.emoji || '🫙') + ' À consommer avant ' + avant + '</span>'
        : INFOS.garde ? '<span class="garde">' + echappe(R.emoji || '🫙') + ' ' + echappe(INFOS.garde) + '</span>' : '') +
      '</div>';
  }

  var pointsEl = document.getElementById('points');
  for (var k = 0; k < N; k++) pointsEl.appendChild(document.createElement('i'));
  function progres(k, type) {
    var pts = pointsEl.children;
    for (var i = 0; i < pts.length; i++) {
      pts[i].className = type === 'fin' || i < k ? 'fait' : i === k ? 'on' : '';
    }
  }

  /// Découpe le texte d'une étape en mots animables, en gardant le gras.
  function animeMots(racineTexte) {
    if (!racineTexte) return;
    var i = 0, marche = document.createTreeWalker(racineTexte, NodeFilter.SHOW_TEXT), noeuds = [];
    while (marche.nextNode()) noeuds.push(marche.currentNode);
    noeuds.forEach(function (n) {
      var f = document.createDocumentFragment();
      n.nodeValue.split(/([ \t\n]+)/).forEach(function (m) {
        if (!m) return;
        if (/^[ \t\n]+$/.test(m)) { f.appendChild(document.createTextNode(m)); return; }
        var s = document.createElement('span');
        s.className = 'mot'; s.textContent = m; s.style.setProperty('--i', Math.min(i++, 18));
        f.appendChild(s);
      });
      n.parentNode.replaceChild(f, n);
    });
  }
  function etapeAnimee(html) {
    var e = el(html);
    animeMots(e.querySelector('.texte'));
    return e;
  }

  // ─── 13 · Le carrousel kawaii ────────────────────────────────
  /// Chaque page porte trois cartes identiques : la précédente, la
  /// sienne, la suivante. Au changement d'étape, chacune part de la
  /// place qu'elle occupait : on voit le manège tourner.
  function contenuCarte(k) {
    if (k < 0) return vedetteHtml();
    if (k >= N) return scene('bocal', '', 'Le bocal se remplit et se ferme');
    return sceneEtape(ETAPES[k]);
  }
  function badgeDe(k) {
    if (k < 0) return '♥';
    if (k >= N) return '✓';
    return String(k + 1);
  }
  function legendeDe(k) {
    if (k < 0) return 'C\u2019est parti\u00a0!';
    if (k >= N) return 'Bravo\u00a0!';
    return echappe((ETAPES[k].emoji || '') + ' étape ' + (k + 1));
  }
  function carte(k, place) {
    var centre = place === 'centre';
    return '<div class="c13 ' + place + (centre ? '' : ' cote') + '"' + (centre ? '' : ' aria-hidden="true"') + '>' +
      '<div class="c13-anneau" data-legende="' + legendeDe(k) + '"><div class="c13-cadre">' + contenuCarte(k) + '</div>' +
      '<b class="c13-badge" aria-hidden="true">' + badgeDe(k) + '</b>' +
      (centre ? '<i class="c13-coeur a" aria-hidden="true">♥</i><i class="c13-coeur b" aria-hidden="true">♥</i>' : '') +
      '</div>' + (centre ? eclats() : '') + '</div>';
  }
  function eclats() {
    var couleurs = ['#E8A87C', '#4A9B5A', '#FF8FAB', '#A8D5A2'];
    var h = '<div class="c13-eclats" aria-hidden="true">';
    for (var i = 0; i < 10; i++) {
      h += '<i style="--a:' + (i * 36) + 'deg;color:' + couleurs[i % 4] + '">' + (i % 2 ? '✦' : '●') + '</i>';
    }
    return h + '</div>';
  }
  function manege(k) {
    return '<div class="zone-scene"><div class="v13-piste">' +
      (k > -1 ? carte(k - 1, 'gauche') : '') +
      (k < N ? carte(k + 1, 'droite') : '') +
      carte(k, 'centre') + '</div></div>';
  }
  var UI = {
    libelles: { depart: 'C’est parti 🌱', suivant: 'Suivant', termine: 'Terminé', revoir: 'Revoir la recette' },
    intro: function () {
      return el('<section class="v13 v14 v13-intro">' + manege(-1) +
        '<h1>' + echappe(R.name) + '</h1>' + pucesHtml() + ingredientsHtml() + '</section>');
    },
    etape: function (s, i) {
      return etapeAnimee('<section class="v13 v14' + (+s.minutes > 0 ? ' a-minuteur' : '') + '">' + manege(i) +
        numHtml(s, i) + texteHtml(s, 30) + (+s.minutes > 0 ? minuteurHtml(false) : '') + '</section>');
    },
    fin: function () {
      return el('<section class="v13 v14 v13-fin">' + confettis(30) + manege(N) +
        '<h1>Bravo ! 🎉</h1>' + etiquetteHtml() + '</section>');
    },
    progres: progres
  };


  // ─── Moteur : pages, navigation, minuteurs ───────────────────
  var app = document.getElementById('app');
  var conteneur = document.getElementById('pages');
  var btnPrec = document.getElementById('prec');
  var btnSuiv = document.getElementById('suiv');
  var mini = document.getElementById('mini');

  var pages = [];
  function ajoutePage(type, noeud, etape) {
    noeud.classList.add('page');
    noeud.setAttribute('aria-hidden', 'true');
    conteneur.appendChild(noeud);
    pages.push({ type: type, el: noeud, etape: etape });
  }

  ajoutePage('intro', UI.intro(), -1);
  ETAPES.forEach(function (s, i) { ajoutePage('etape', UI.etape(s, i), i); });
  ajoutePage('fin', UI.fin(), N);

  // ─── Texte qui tient dans l'écran ──────────────────────────────
  /// Part de la grande taille et descend d'un pixel tant que la page
  /// déborde. Une étape longue sur un petit téléphone reste entière,
  /// sans défilement, et une étape courte garde ses grosses lettres.
  function ajuste(page) {
    var t = page.querySelector('[data-fit]');
    if (!t) return;
    var taille = +t.getAttribute('data-max');
    var min = +t.getAttribute('data-min');
    t.style.fontSize = taille + 'px';
    var anim = page.classList.contains('entre-d') ? 'entre-d' : page.classList.contains('entre-g') ? 'entre-g' : null;
    if (anim) page.classList.remove(anim);
    var garde = 40;
    while (taille > min && page.scrollHeight > page.clientHeight + 1 && garde--) {
      taille -= 1;
      t.style.fontSize = taille + 'px';
    }
    if (anim) page.classList.add(anim);
  }

  // ─── Affichage d'une page ──────────────────────────────────────
  var index = -1;
  function montre(n) {
    if (n < 0 || n >= pages.length || n === index) return;
    var avant = index;
    index = n;
    var p = pages[n];
    pages.forEach(function (q, i) {
      var on = i === n;
      q.el.classList.toggle('active', on);
      q.el.setAttribute('aria-hidden', on ? 'false' : 'true');
      q.el.classList.remove('entre-d', 'entre-g');
    });
    // La taille du texte se calcule avant l'animation d'entrée : une
    // carte encore décalée fausserait la mesure.
    ajuste(p.el);
    if (!REDUIT && avant >= 0) {
      void p.el.offsetWidth;
      p.el.classList.add(n > avant ? 'entre-d' : 'entre-g');
    }
    app.setAttribute('data-page', p.type);
    p.el.scrollTop = 0;
    UI.progres(p.etape, p.type);

    btnPrec.style.visibility = n === 0 ? 'hidden' : 'visible';
    var libelle;
    if (p.type === 'intro') libelle = UI.libelles.depart;
    else if (p.type === 'fin') libelle = UI.libelles.revoir;
    else if (p.etape === N - 1) libelle = UI.libelles.termine;
    else libelle = UI.libelles.suivant;
    btnSuiv.querySelector('.libelle').textContent = libelle;
    btnSuiv.classList.toggle('sans-fleche', p.type !== 'etape' || p.etape === N - 1);

    rafraichit();
  }

  function suivant() {
    if (index === pages.length - 1) montre(0);
    else montre(index + 1);
  }
  function precedent() { montre(index - 1); }

  btnSuiv.addEventListener('click', suivant);
  btnPrec.addEventListener('click', precedent);

  // ─── Doigts : balayer, ou toucher la moitié droite ─────────────
  /// Les mains sont souvent pleines de pulpe : toucher la moitié
  /// droite d'une étape avance, comme le bouton. Un balayage marche
  /// dans les deux sens.
  var x0 = null, y0 = null, balaye = false;
  document.addEventListener('touchstart', function (e) {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; balaye = false;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    var dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      balaye = true;
      if (dx < 0) suivant(); else precedent();
    }
    x0 = null;
  }, { passive: true });

  conteneur.addEventListener('click', function (e) {
    if (balaye) { balaye = false; return; }
    var p = pages[index];
    if (!p || p.type !== 'etape') return;
    if (e.target.closest('button, a')) return;
    if (e.clientX > window.innerWidth * 0.5) suivant();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') suivant();
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') precedent();
  });

  // ─── Écran allumé, son, vibration ──────────────────────────────
  var verrou = null, audio = null;
  function garderEveille() {
    try {
      if (verrou || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      navigator.wakeLock.request('screen').then(function (v) {
        verrou = v;
        v.addEventListener('release', function () { verrou = null; });
      }).catch(function () {});
    } catch (e) { /* WebView sans wakeLock : Dart peut le faire. */ }
  }
  function premierGeste() {
    garderEveille();
    try {
      if (!audio) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (C) audio = new C();
      }
      if (audio && audio.state === 'suspended') audio.resume();
    } catch (e) { audio = null; }
  }
  document.addEventListener('pointerdown', premierGeste, { passive: true });
  document.addEventListener('visibilitychange', garderEveille);

  /// Trois bips doux, générés sur place : aucun fichier son à charger.
  function sonne() {
    try { if (navigator.vibrate) navigator.vibrate([280, 140, 280, 140, 280]); } catch (e) {}
    if (!audio) return;
    try {
      var t = audio.currentTime;
      for (var k = 0; k < 3; k++) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = 'sine';
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t + k * 0.45);
        g.gain.exponentialRampToValueAtTime(0.35, t + k * 0.45 + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + k * 0.45 + 0.32);
        o.connect(g); g.connect(audio.destination);
        o.start(t + k * 0.45); o.stop(t + k * 0.45 + 0.35);
      }
    } catch (e) {}
  }

  // ─── Minuteurs ─────────────────────────────────────────────────
  /// De vrais minuteurs : ils comptent pour de bon, continuent quand
  /// on change d'étape, et sonnent à la fin. Une pastille en haut
  /// ramène à celui qui tourne.
  var minuteurs = {};
  pages.forEach(function (p, i) {
    if (p.type !== 'etape') return;
    var min = +ETAPES[p.etape].minutes;
    if (!min || min <= 0) return;
    minuteurs[i] = { total: min * 60000, reste: min * 60000, fin: 0,
      marche: false, fini: false, parti: false };
    var b = p.el.querySelector('[data-t="bascule"]');
    var plus = p.el.querySelector('[data-t="plus"]');
    if (b) b.addEventListener('click', function () { bascule(i); });
    if (plus) plus.addEventListener('click', function () { ajoute5(i); });
  });

  function resteDe(t) { return t.marche ? Math.max(0, t.fin - Date.now()) : t.reste; }

  function bascule(i) {
    var t = minuteurs[i];
    premierGeste();
    if (t.fini) { t.fini = false; t.reste = t.total; }
    if (t.marche) { t.reste = resteDe(t); t.marche = false; }
    else { t.fin = Date.now() + t.reste; t.marche = true; t.parti = true; }
    rafraichit();
  }
  function ajoute5(i) {
    var t = minuteurs[i];
    premierGeste();
    if (t.fini) {
      // Pas tout à fait prêt : on relance cinq minutes de plus.
      t.fini = false; t.total = 300000; t.reste = 300000;
      t.fin = Date.now() + 300000; t.marche = true;
    } else {
      if (t.marche) t.fin += 300000; else t.reste += 300000;
      t.total += 300000;
    }
    rafraichit();
  }

  function deux(n) { return (n < 10 ? '0' : '') + n; }
  function hms(ms) {
    var s = Math.ceil(ms / 1000);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return h ? h + ':' + deux(m) + ':' + deux(r) : m + ':' + deux(r);
  }

  function rafraichit() {
    var actif = null;
    Object.keys(minuteurs).forEach(function (k) {
      var i = +k, t = minuteurs[i], p = pages[i].el;
      var reste = resteDe(t);
      if (t.marche && reste <= 0) {
        t.marche = false; t.fini = true; t.reste = 0;
        sonne();
      }
      reste = resteDe(t);
      var fraction = t.total ? 1 - reste / t.total : 0;
      p.style.setProperty('--p', Math.max(0, Math.min(1, fraction)).toFixed(4));
      p.classList.toggle('en-marche', t.marche);
      p.classList.toggle('fini', t.fini);
      p.classList.toggle('en-pause', !t.marche && !t.fini && t.parti);
      var temps = p.querySelector('.t-temps');
      if (temps) {
        temps.textContent = t.fini ? '0:00' : hms(reste);
        temps.classList.toggle('long', temps.textContent.length > 5);
      }
      var etat = p.querySelector('.t-etat');
      if (etat) {
        etat.textContent = t.fini ? 'C’est prêt !'
          : t.marche ? 'Ça tourne… je sonne à la fin'
          : t.parti ? 'En pause'
          : dureeLisible(Math.round(t.total / 60000)) + ', quand tu es prêt';
      }
      var b = p.querySelector('[data-t="bascule"]');
      if (b) {
        b.textContent = t.fini ? '↺ Relancer' : t.marche ? '❚❚ Pause'
          : t.parti ? '▶ Reprendre' : '▶ Lancer';
      }
      if ((t.marche || t.fini) && i !== index && !actif) {
        actif = { i: i, t: t, reste: reste };
      }
    });
    var etaitCache = mini.hidden;
    if (actif) {
      mini.hidden = false;
      mini.classList.toggle('fini', actif.t.fini);
      mini.textContent = (actif.t.fini ? '⏰ C’est prêt' : '⏱ ' + hms(actif.reste)) +
        ' · étape ' + (pages[actif.i].etape + 1);
      mini.onclick = function () { montre(actif.i); };
    } else {
      mini.hidden = true;
    }
    // La pastille prend de la hauteur : le texte doit se réajuster.
    if (etaitCache !== mini.hidden && index >= 0) ajuste(pages[index].el);
  }
  setInterval(function () {
    for (var k in minuteurs) {
      if (minuteurs[k].marche) { rafraichit(); return; }
    }
  }, 250);

  window.addEventListener('resize', function () {
    if (index >= 0) ajuste(pages[index].el);
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      if (index >= 0) ajuste(pages[index].el);
    });
  }

  montre(0);

})();
</script>
</body>
</html>
