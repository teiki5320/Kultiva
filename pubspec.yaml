name: kultiva
description: "Kultiva — Calendrier de semis pour jardiniers (Flutter)."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: ^3.5.0
  # Borne relevée le 30/10/2026 : sous Flutter 3.41.6, `pdf_service.dart`
  # ne compile plus (13 erreurs d'évaluation de constantes sur
  # `pw.TextStyle`). Ça a coûté deux builds Xcode Cloud rouges dont le
  # rapport ne disait rien — mieux vaut échouer ici, à `pub get`, avec un
  # message clair. 3.47.0 est la borne vérifiée : 3.47.3 compile, 3.41.6
  # non ; l'entre-deux n'a pas été testé.
  # Avant cette borne, le code exigeait déjà ≥ 3.38 (RadioGroup,
  # activeThumbColor, scaleByDouble/translateByDouble).
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Localisations Material/Cupertino : sans elles, le DatePicker et les
  # widgets Material s'affichent en anglais (« July 2026 », « Select date »)
  # au milieu d'une app 100 % française. Locale fr-FR forcée dans main.dart.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^6.1.0

  # Préférences locales
  shared_preferences: ^2.2.2

  # Aucun backend : les comptes ont été retirés de la v1 (30/10/2026) et
  # le jardin vit entièrement sur l'appareil. supabase_flutter,
  # google_sign_in, sign_in_with_apple et crypto ont donc été retirés
  # avec eux.

  # Notifications (planification mensuelle + alertes météo)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  # Fuseau horaire réel du device : sans lui, tz.local reste UTC et les
  # notifications planifiées (rappel mensuel 9h, Tamassi 19h) sonnaient
  # 1 à 2h trop tard en France. ^3.x requis : les 1.x utilisent l'API
  # Android v1 (Registrar) supprimée des Flutter récents (build cassé),
  # et les 4.x changent le type de retour (TimezoneInfo au lieu de
  # String). getLocalTimezone() reste identique en 3.x.
  flutter_timezone: ^3.0.1

  # URL launcher (liens externes, ex. Instagram ; plus de lien Amazon depuis le 20/10/2026)
  url_launcher: ^6.2.2

  # Export PDF
  pdf: ^3.10.0
  printing: ^5.12.0

  # Géolocalisation
  geolocator: ^11.0.0

  # Reverse geocoding (coords → nom de ville) pour la météo.
  #
  # Monté 3 → 5 le 30/10/2026. La 5 déplace les fonctions globales dans
  # une classe : `placemarkFromCoordinates(...)` devient
  # `Geocoding().placemarkFromCoordinates(...)` — trois appels à
  # changer. Côté iOS, `geocoding_ios` laisse la place à
  # `geocoding_darwin`. Exige iOS 12+ (le projet est en 15) et
  # compileSdk 35+ (Flutter en fournit 36).
  geocoding: ^5.0.0

  # Gestion des permissions (caméra, etc.) avec accès direct aux réglages OS.
  # Sert à une seule chose dans l'app : `openAppSettings()`, pour
  # emmener l'utilisateur dans les réglages système quand il a refusé
  # la caméra (voir photo_service.dart). Les permissions de
  # localisation passent, elles, par geolocator.
  # La 13 exige le SDK Android 37 : la CI l'installe explicitement.
  permission_handler: ^13.0.2

  # HTTP (météo Open-Meteo)
  http: ^1.2.0

  # Audio (sons + musique de fond)
  audioplayers: ^6.1.0

  # Photos des plants du Poussidex
  image_picker: ^1.0.4
  path_provider: ^2.1.1

  # Partage d'images (cartes Poussidex sur Instagram / Stories)
  share_plus: ^7.2.1

  # Capteurs (inclinaison + secouer pour les animations de la créature)
  # Monté 6 → 7 le 30/10/2026 : `accelerometerEventStream` et
  # `AccelerometerEvent`, seuls usages de l'app, sont inchangés.
  sensors_plus: ^7.1.0

  # WebView pour les fiches tuto HTML
  webview_flutter: ^4.10.0

  # Crash reporting (erreurs + stack traces envoyés à Sentry).
  #
  # Monté 8 → 9 le 30/10/2026. L'app n'utilise que `SentryFlutter.init`,
  # `options.dsn`, `tracesSampleRate` et `captureException(withScope:)`,
  # inchangés entre les deux.
  #
  # ⚠️ **Ne pas passer en 10 tel quel.** La 10 abandonne CocoaPods pour
  # Swift Package Manager (`darwin/sentry_flutter/Package.swift`, plus
  # aucun podspec) : le pod disparaît du `Podfile.lock` et le crash
  # reporting iOS cesse d'être compilé dans l'app, sans que rien
  # n'échoue bruyamment. La montée demande d'activer SPM
  # (`flutter config --enable-swift-package-manager`), de migrer le
  # projet Xcode et de revalider Xcode Cloud — une migration de système
  # de build, pas une montée de dépendance.
  sentry_flutter: ^9.30.0

  # Demande de note sur les stores après un moment positif
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Génération des icônes iOS + Android à partir de assets/images/app_icon.png
  flutter_launcher_icons: ^0.14.0
  # Splash natif (logo Kultiva sur fond crème pendant le chargement Flutter)
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/badges/
    - assets/images/accessories/
    - assets/images/vegetables/
    - assets/images/backgrounds/
    - assets/tutos/
    - assets/tutos/screens/
    - assets/tutos/screens/dashboard/
    - assets/sounds/
    # Nunito bundlée localement : google_fonts la charge depuis les
    # assets au lieu de la télécharger (démarrage offline, zéro data).
    - assets/google_fonts/

# ─── Packages intentionnellement non-majorés (breaking API) ───
#
# Les majeures suivantes sont disponibles mais demandent une
# migration non-triviale. À reprendre quand on a du temps :
#   flutter_local_notifications 16 → 21 (schéma channels / perms)
#   geolocator 11 → 14               (API position async)
#   share_plus 7 → 13                (API Share change)
#   google_fonts 6 → 8               (à vérifier)
#   printing 5 → dernière            (Dart 3+ stricter)
# Vérifier en lançant `flutter pub outdated --show-all`.

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FCF4E1"
  min_sdk_android: 21
  # Icône adaptative Android (API 26+) : fond crème + lettre en premier plan.
  adaptive_icon_background: "#FCF4E1"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#FCF4E1"
  image: assets/images/app_icon.png
  android_12:
    color: "#FCF4E1"
    image: assets/images/app_icon.png
  ios: true
  web: false
